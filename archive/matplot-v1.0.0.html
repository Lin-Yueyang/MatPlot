    <h1>材料绘图台</h1>
    <section aria-label="可用工具"><a class="tool ready" href="#steps"><div><h3>反应自由能台阶图</h3><p>从 E、Gcorr 和小分子参考能出发，比较多个体系和分支反应。</p><span class="launch">打开工具 <span aria-hidden="true">→</span></span></div><canvas aria-hidden="true" class="preview" data-plot="steps"></canvas></a>
<a class="tool ready" href="#barrier"><div><h3>Slow growth 能垒积分</h3><p>读取 VASP 约束力，拼接计算分段，绘制自由能与导数。</p><span class="launch">打开工具 <span aria-hidden="true">→</span></span></div><canvas aria-hidden="true" class="preview" data-plot="barrier"></canvas></a>
<a class="tool ready" href="#dos"><div><h3>DOS / PDOS</h3><p>读取总态密度与轨道投影，比较元素、原子和自旋。</p><span class="launch">打开工具 <span aria-hidden="true">→</span></span></div><canvas aria-hidden="true" class="preview" data-plot="dos"></canvas></a>
<a class="tool ready" href="#cohp"><div><h3>COHP / ICOHP</h3><p>选择原子对，比较能量分辨的成键曲线与积分值。</p><span class="launch">打开工具 <span aria-hidden="true">→</span></span></div><canvas aria-hidden="true" class="preview" data-plot="cohp"></canvas></a></section>
    <section aria-labelledby="planned"><h2 id="planned">规划中</h2><div class="upcoming"><article class="tool"><div><h3>NEB 能垒图</h3><p>比较路径上各构型的能量，标出初态、峰值与终态。</p></div><canvas aria-hidden="true" class="mini-chart" data-plot="neb"></canvas></article>
<article class="tool"><div><h3>火山图</h3><p>用吸附能等描述符比较材料活性，标记候选体系。</p></div><canvas aria-hidden="true" class="mini-chart" data-plot="volcano"></canvas></article></div></section>
  </main>
  <script>
    // These small illustrations identify plot types; they contain no project data.
    function preview(canvas) {
      const box=canvas.getBoundingClientRect(), scale=window.devicePixelRatio || 1;
      canvas.width=Math.round(box.width*scale);canvas.height=Math.round(box.height*scale);
      const ctx=canvas.getContext('2d');ctx.scale(canvas.width/120,canvas.height/60);
      const featured=canvas.classList.contains('preview'), ink=featured?'#dcebd3':'#3a716d', secondary=featured?'#83b4a8':'#a9bab2';
      function line(points,color,width=1.7,dash=[]) {
        ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);
        points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();
      }
      const type=canvas.dataset.plot;
      if(type==='steps') {
        for(const [ys,color] of [[[37,49,29,10],ink],[[37,54,40,26],secondary]]) {
          ys.forEach((y,i)=>{const x=3+i*30;line([[x,y],[x+20,y]],color,2.2);if(i<3)line([[x+20,y],[x+30,ys[i+1]]],color,1,[2,2]);});
        }
      } else if(type==='barrier' || type==='neb') {
        const pts=[[4,48],[24,43],[42,19],[56,10],[74,21],[94,39],[116,41]];line(pts,ink,2);
        for(const [x,y] of pts){ctx.fillStyle=ink;ctx.beginPath();ctx.arc(x,y,2.7,0,Math.PI*2);ctx.fill();}
      } else if(type==='dos' || type==='cohp') {
        const mid=type==='cohp'?30:52;line([[2,mid],[118,mid]],secondary,1);
        const peak=(x,c,w)=>Math.exp(-((x-c)**2)/(w*w));
        const pts=Array.from({length:115},(_,i)=>[i+3,mid-23*peak(i,32,12)-(type==='cohp'?-20:32)*peak(i,71,10)-9*peak(i,95,8)]);line(pts,ink,2);
      } else if(type==='volcano') {line([[5,48],[62,9],[116,46]],secondary,2);for(const [x,y] of [[17,41],[38,26],[56,16],[69,17],[90,32],[110,45]]){ctx.fillStyle=ink;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();}}
    }
    const previews=document.querySelectorAll('canvas');const redraw=()=>previews.forEach(preview);redraw();window.addEventListener('resize',redraw);
  </script>

nvas-editor\" hidden>\u003cdiv class=\"field\">\u003ctextarea id=\"canvas-text\" aria-label=\"编辑图中文字\" rows=\"2\">\u003c/textarea>\u003cdiv class=\"format-bar\">\u003cbutton data-format=\"sub\" title=\"下标\">x₂\u003c/button>\u003cbutton data-format=\"super\" title=\"上标\">x²\u003c/button>\u003cbutton id=\"canvas-text-apply\" title=\"保存 Enter\">✓\u003c/button>\u003cbutton id=\"canvas-text-cancel\" title=\"取消 Esc\">×\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\r\n      \u003cdiv id=\"warnings\" role=\"status\">\u003c/div>\r\n    \u003c/main>\r\n    \u003cdiv id=\"right-resize\" class=\"resize-handle\" role=\"separator\" aria-label=\"调整右栏宽度\" aria-orientation=\"vertical\" tabindex=\"0\" data-side=\"right\">\u003c/div>\r\n    \u003caside id=\"inspector\" class=\"inspector\">\u003cdiv class=\"inspector-heading\">\u003cdiv class=\"tabs\">\u003cbutton class=\"active\" data-inspect=\"object\">对象\u003c/button>\u003cbutton data-inspect=\"style\">全局样式\u003c/button>\u003c/div>\u003cbutton id=\"inspector-close\" class=\"icon\" title=\"收起右栏\">×\u003c/button>\u003c/div>\u003cdiv id=\"inspector-content\" class=\"panel-scroll\">\u003c/div>\u003c/aside>\r\n  \u003c/div>\r\n  \u003cdiv id=\"toast\" role=\"status\">\u003c/div>\r\n  \u003cdiv id=\"state-menu\" class=\"state-menu\" role=\"menu\" aria-label=\"状态操作\" hidden>\u003cbutton type=\"button\" role=\"menuitem\" data-state-command=\"add-node\">添加状态\u003c/button>\u003cbutton type=\"button\" role=\"menuitem\" data-state-command=\"add-branch\">添加分支\u003c/button>\u003cbutton type=\"button\" role=\"menuitem\" data-state-command=\"insert-blank\">添加空白状态\u003c/button>\u003cbutton type=\"button\" role=\"menuitem\" data-state-command=\"baseline\">设为归零参照\u003c/button>\u003cbutton type=\"button\" role=\"menuitem\" data-state-command=\"auto-baseline\">恢复首态归零\u003c/button>\u003cbutton type=\"button\" role=\"menuitem\" data-state-command=\"branch\">设为分支…\u003c/button>\u003cbutton type=\"button\" role=\"menuitem\" data-state-command=\" "下划线\">\u003cu>U\u003c/u>\u003c/button>\u003cbutton id=\"resetText\">重置所选\u003c/button>\u003c/div>\r\n\u003cdiv id=\"figure\" class=\"figure\" tabindex=\"0\">\u003cdiv class=\"empty\">\u003cdiv>\u003cstrong>读取本地计算目录\u003c/strong>REPORT · ICONST · POSCAR · INCAR\u003c/div>\u003c/div>\u003c/div>\u003cp id=\"message\" class=\"message\" role=\"status\">\u003c/p>\u003cp id=\"importStatus\" class=\"message\" role=\"status\">\u003c/p>\u003c/div>\u003c/main>\r\n\u003cscript>\n(function (root) {\n  'use strict';\n  const factor = { eV: 1, 'kJ/mol': 96.48533212, 'kcal/mol': 23.06054783 };\n  const uid = () => 'id' + Math.random().toString(36).slice(2, 10);\n  const clone = value => JSON.parse(JSON.stringify(value));\n  const newHistory = () => ({ entries: [], index: -1, group: '' });\n  function recordHistory(history, value, group = '', label = '编辑工程') {\n    if (history.entries[history.index]?.value === value) { if (!group) history.group = ''; return; }\n    if (group && history.group === group && history.index === history.entries.length - 1) history.entries[history.index] = { value, label };\n    else {\n      history.entries = history.entries.slice(0, history.index + 1);\n      history.entries.push({ value, label }); if (history.entries.length > 80) history.entries.shift();\n      history.index = history.entries.length - 1;\n    }\n    history.group = group;\n  }\n  function moveHistory(history, direction) {\n    history.group = '';\n    const index = history.index + direction;\n    if (index \u003c 0 || index >= history.entries.length) return null;\n    history.index = index; return history.entries[index].value;\n  }\n  const defaults = () => ({ width: 1040, height: 660, plotWidth: '', plotHeight: '', font: 'Arial, Microsoft YaHei, sans-serif',\n    fontSize: 24, deltaSize: 20, titleSize: 27, lineWidth: 3.5, stepWidth: 0.60,\n    dash: 7, gap: 5, grid: true, gridWidth: .8, gridColor: '#edf0f1', axisWidth: 1.2, axisColor: '#63747d',\n    legendVisible: true, legendLayout: 'horizontal', legendSize: '', legendFont: '', legendColor: '#425867', legendBold: false,\n    legendDx: 0, legendDy: 0, legendLineWidth: '', legendLineLength: 28, legendGap: 22,\n    legendBox: false, legendBackground: '#ffffff', legendBorderColor: '#cbd5d8', legendBorderWidth: 1,\n    deltas: true, energies: false,\n    decimals: 3, yMin: '', yMax: '', unit: 'eV', theme: 'blue', legend: 'top' });\n  function blank() {\n    return { version: 1, title: 'Free energy diagram', subtitle: '', xLabel: 'Reaction coordinate',\n      yLabel: 'Relative free energy', note: '', inputMode: 'raw', energyMode: 'G',\n      refs: [], systems: [], drafts: { id:'', nodes:[], edges:[] }, style: defaults(), annotations: {} };\n  }\n  function parseTerms(source, refs) {\n    if (!source.trim()) return { terms: [], error: '' };\n    const terms = [];\n    for (const part of source.split(/[,;，；\\n]+/).filter(s => s.trim())) {\n      const match = part.trim().match(/^([A-Za-z][A-Za-z0-9_-]*)\\s*[:=：]\\s*([+-]?(?:\\d+(?:\\.\\d*)?|\\.\\d+))$/);\n      if (!match) return { terms: [], error: '格式示例：H2:0.5, H2O:-1（使用参考库中的 ID）' };\n      terms.push({ ref: match[1], n: Number(match[2]) });\n    }\n    return { terms, error: '' };\n  }\n  const termsText = terms => terms.map(term => term.ref + ':' + term.n).join(', ');\n  const ready = v => typeof v === 'number' && Number.isFinite(v);\n  function combined(project, state) {\n    const corrected = project.energyMode === 'G';\n    const pieces = [{ name: '结构 E', value: state.e }];\n    if (corrected) pieces.push({ name: '结构 Gcorr', value: state.gcorr });\n    const pending = [];\n    for (const term of state.terms) {\n      const ref = project.refs.find(r => r.id === term.ref);\n      const valid = ref && ready(ref.e) && (!corrected || ready(ref.gcorr));\n      if (!valid && term.n) pending.push(term.ref);\n      pieces.push({ name: term.n + ' × ' + (ref?.name || term.ref), value: !term.n ? 0 : valid ? term.n * (ref.e + (corrected ? ref.gcorr : 0)) : n fr auto;align-items:center;gap:6px;padding:6px 0;border-top:1px solid #edf0ed}.bond input[type=color]{width:30px;height:24px;padding:1px}.bond small{display:block;color:#6b7e79;font-size:11px}.bond label{overflow-wrap:anywhere}.figure svg text{cursor:move}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\u003cheader>\u003ca id=\"home\" href=\"./index.html\" title=\"返回材料绘图台\">\u003cimg alt=\"\" width=\"24\" height=\"24\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+CiAgPHJlY3Qgd2lkdGg9IjQ4IiBoZWlnaHQ9IjQ4IiByeD0iMTEiIGZpbGw9IiMxNzRkNDgiLz4KICA8cGF0aCBkPSJNOSAxMHYyOGgzMCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjOTZiY2IwIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+CiAgPHBhdGggZD0ibTExIDMxIDgtMTEgNyA1IDEwLTEzIiBmaWxsPSJub25lIiBzdHJva2U9IiNmM2Y4ZTkiIHN0cm9rZS13aWR0aD0iNCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+CiAgPGNpcmNsZSBjeD0iMzYiIGN5PSIxMiIgcj0iMy44IiBmaWxsPSIjZWRiZDcyIi8+Cjwvc3ZnPgo=\"> MatPlot\u003c/a>\u003ch1>DOS 与 PDOS\u003c/h1>\u003csmall class=\"version\">v1.0.0\u003c/small>\u003c/header>\u003cmain>\r\n\u003caside>\u003csection>\u003ch2>计算数据\u003c/h2>\u003cdiv class=\"actions\">\u003cbutton id=\"dir\" class=\"primary\">读取本地目录\u003c/button>\u003c/div>\u003cinput type=\"file\" hidden multiple id=\"source\">\u003cdiv id=\"info\" class=\"small\">\u003c/div>\u003cp class=\"message\" role=\"status\" id=\"notice\">\u003c/p>\u003c/section>\r\n\u003csection>\u003ch2>投影\u003c/h2>\u003cdiv id=\"bonds\">\u003c/div>\u003c/section>\r\n\u003csection>\u003ch2>曲线\u003c/h2>\u003clabel class=\"row\">自旋\u003cselect id=\"spin\">\u003coption value=\"sum\">合计\u003c/option>\u003coption value=\"both\">分别显示 ↑ ↓\u003c/option>\u003coption value=\"up\">仅 ↑\u003c/option>\u003coption value=\"down\">仅 ↓\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"row\">自旋显示方向\u003cselect id=\"spinDirection\">\u003coption value=\"same\">同向\u003c/option>\u003coption value=\"opposite\">反向（↓ 镜像）\u003c/option ss=\"sheet\">\u003cdiv class=\"sheet-head\">\u003ch2>态密度\u003c/h2>\u003cdiv class=\"actions\">\u003cbutton id=\"undo\" title=\"撤销 Ctrl+Z\" disabled>↶\u003c/button>\u003cbutton id=\"redo\" title=\"重做 Ctrl+Y\" disabled>↷\u003c/button>\u003cdetails class=\"export\">\u003csummary>导出 ▾\u003c/summary>\u003cdiv>\u003cbutton data-export=\"png\" disabled>PNG\u003c/button>\u003cbutton data-export=\"svg\" disabled>SVG\u003c/button>\u003cbutton data-export=\"csv\" disabled>CSV\u003c/button>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\r\n\u003cdiv id=\"textTools\" hidden>\u003cinput id=\"words\" aria-label=\"文字内容\">\u003cspan id=\"scripts\" class=\"script-buttons\">\u003c/span>\u003cinput type=\"number\" id=\"size\" min=\"6\" max=\"72\" aria-label=\"文字字号\">\u003cinput id=\"ink\" type=\"color\" aria-label=\"文字颜色\">\u003cbutton id=\"resetText\">重置所选\u003c/button>\u003c/div>\r\n\u003cdiv id=\"figure\" class=\"figure\" tabindex=\"0\">\u003cdiv class=\"empty\">\u003cdiv>\u003cstrong>读取本地计算目录\u003c/strong>投影 .dat · DOSCAR · POSCAR\u003c/div>\u003c/div>\u003c/div>\u003cp id=\"message\" class=\"message\" role=\"status\">\u003c/p>\u003c/div>\u003c/main>\r\n\u003cscript>\n(function (root) {\n  'use strict';\n  const factor = { eV: 1, 'kJ/mol': 96.48533212, 'kcal/mol': 23.06054783 };\n  const uid = () => 'id' + Math.random().toString(36).slice(2, 10);\n  const clone = value => JSON.parse(JSON.stringify(value));\n  const newHistory = () => ({ entries: [], index: -1, group: '' });\n  function recordHistory(history, value, group = '', label = '编辑工程') {\n    if (history.entries[history.index]?.value === value) { if (!group) history.group = ''; return; }\n    if (group && history.group === group && history.index === history.entries.length - 1) history.entries[history.index] = { value, label };\n    else {\n      history.entries = history.entries.slice(0, history.index + 1);\n      history.entries.push({ value, label }); if (history.entries.length > 80) history.entries.shift();\n      history.index = history.entries.length - 1;\n    }\n    history.group = group;\n  }\n  function moveHistory(history, direction) {\n    history.group = '';\n    const index = history.index + direction;\n    if (index \u003c 0 || index >= history.entries.length) return null;\n    history.index = index; return history.entries[index].value;\n  }\n  const defaults = () => ({ width: 1040, height: 660, plotWidth: '', plotHeight: '', font: 'Arial, Microsoft YaHei, sans-serif',\n    fontSize: 24, deltaSize: 20, titleSize: 27, lineWidth: 3.5, stepWidth: 0.60,\n    dash: 7, gap: 5, grid: true, gridWidth: .8, gridColor: '#edf0f1', axisWidth: 1.2, axisColor: '#63747d',\n    legendVisible: true, legendLayout: 'horizontal', legendSize: '', legendFont: '', legendColor: '#425867', legendBold: false,\n    legendDx: 0, legendDy: 0, legendLineWidth: '', legendLineLength: 28, legendGap: 22,\n    legendBox: false, legendBackground: '#ffffff', legendBorderColor: '#cbd5d8', legendBorderWidth: 1,\n    deltas: true, energies: false,\n    decimals: 3, yMin: '', yMax: '', unit: 'eV', theme: 'blue', legend: 'top' });\n  function blank() {\n    return { version: 1, title: 'Free energy diagram', subtitle: '', xLabel: 'Reaction coordinate',\n      yLabel: 'Relative free energy', note: '', inputMode: 'raw', energyMode: 'G',\n      refs: [], systems: [], drafts: { id:'', nodes:[], edges:[] }, style: defaults(), annotations: {} };\n  }\n  function parseTerms(source, refs) {\n    if (!source.trim()) return { terms: [], error: '' };\n    const terms = [];\n    for (const part of source.split(/[,;，；\\n]+/).filter(s => s.trim())) {\n      const match = part.trim().match(/^([A-Za-z][A-Za-z0-9_-]*)\\s*[:=：]\\s*([+-]?(?:\\d+(?:\\.\\d*)?|\\.\\d+))$/);\n      if (!match) return { terms: [], error: '格式示例：H2:0.5, H2O:-1（使用参考库中的 ID）' };\n      terms.push({ ref: match[1], n: Number(match[2]) });\n    }\n    return { terms, error: '' };\n  }\n  const termsText = terms => terms.map(term => term.ref + ':' + term.n).join(' erySelectorAll('[data-export]'))b.onclick=async()=>{\r\n  if(!valid)return;document.querySelector('.export').open=false;const ext=b.dataset.export,type={svg:'image/svg+xml',png:'image/png',csv:'text/csv'}[ext];\r\n  const quantity=tool.symbol();\r\n  const xml=ext==='csv'?'':PlotTools.source(fig.querySelector('svg'));\r\n  let csv='';\r\n  if(ext==='csv'){\r\n    const grid=series[0].points;\r\n    const shared=series.every(s=>s.points.length===grid.length && s.points.every((p,i)=>p[0]===grid[i][0]));\r\n    csv=PlotTools.stringify(shared?[['E-EF_eV',...series.map(s=>quantity+' '+s.label)],...grid.map(([e],i)=>[e,...series.map(s=>s.points[i][1])])]:[['series','E-EF_eV',quantity],...series.flatMap(s=>s.points.map(p=>[s.label,...p]))]);\r\n  }\r\n  const saved=await StepFiles.save(()=>ext==='png'?PlotTools.png(xml):new Blob([ext==='csv'?csv:xml],{type}),PlotTools.filename($('title').value,ext),type);\r\n  if(['error','unsupported'].includes(saved.status))$('notice').textContent=saved.message || '请使用支持选择保存位置的浏览器。';\r\n};\r\n\r\nconst tracked=[...document.querySelectorAll('aside input[id]:not([type=file]),aside select')];\r\nconst historyStates=[];let cursor=-1;\r\nfunction remember(){\r\n  if(!data)return;\r\n  const fields=tracked.map(el=>el.type==='checkbox'?el.checked:el.value);\r\n  const json=JSON.stringify({fields,active,styles:[...styles],colors:data.items.map(x=>x.color),strokes:data.items.map(x=>x.strokes||{})});\r\n  const last=historyStates[cursor];\r\n  if(last?.data!==data || last.json!==json){\r\n    historyStates.splice(cursor+1);historyStates.push({data,name:datasetName,json});\r\n    if(historyStates.length>80)historyStates.shift();cursor=historyStates.length-1;\r\n  }\r\n  $('undo').disabled=cursor\u003c=0;$('redo').disabled=cursor>=historyStates.length-1;\r\n}\r\nfunction restore(direction){\r\n  remember();const next=historyStates[cursor+direction];if(!next)return;\r\n  cursor+=direction;data=next.data;datasetName=next.name;\r\n  const state=JSON.parse(next.json);active=state.active;styles=new Map(state.styles);\r\n  data.items.forEach((x,i)=>{x.color=state.colors[i];x.strokes=state.strokes[i];});\r\n  tracked.forEach((el,i)=>{if(el.type==='checkbox')el.checked=state.fields[i];else el.value=state.fields[i];});\r\n  $('spin').disabled=data.spins===1;renderList();draw();remember();\r\n}\r\ndocument.addEventListener('change',remember);\r\n$('undo').onclick=()=>restore(-1);$('redo').onclick=()=>restore(1);\r\ndocument.addEventListener('keydown',e=>{\r\n  if(!(e.ctrlKey||e.metaKey)||e.altKey)return;\r\n  const k=e.key.toLowerCase();if(k!=='z' && k!=='y')return;\r\n  if(!historyStates.length)return;\r\n  e.preventDefault();restore(k==='y'||e.shiftKey?1:-1);\r\n});\r\n\r\n\n\u003c/script>\r\n\u003c/body>\u003c/html>\r\n"}</script><script>'use strict';
const documents=JSON.parse(document.getElementById('tool-documents').textContent);
const nav=document.getElementById('tabbar'),landing=document.querySelector('main'),frames=document.getElementById('frames'),tabs=[];
let current=null,moving=null;
function selectTab(tab){
  current=tab;landing.hidden=!!tab;frames.hidden=!tab;
  for(const t of tabs){t.frame.hidden=t!==tab;t.button.setAttribute('aria-selected',String(t===tab));}
  document.getElementById('addTab').setAttribute('aria-expanded',String(!tab));
  if(!tab){window.dispatchEvent(new Event('resize'));landing.querySelector('a')?.focus();}
}
function openTool(file,label){
  const frame=document.createElement('iframe'),group=document.createElement('div'),button=document.createElement('button'),close=document.createElement('button');
  const used=new Set(tabs.map(t=>t.label));let name=label,n=1;while(used.has(name))name=label+' '+(++n);
  const tab={frame,group,button,label:name};frame.title=name;let slot=1;while(tabs.some(t=>t.frame.name==='studio-'+(file==='steps'?'stepplot.html':file)+'-'+slot))slot++;frame.name='studio-'+(file==='steps'?'stepplot.html':file)+'-'+slot;group.className='studio-tab';
  button.textContent=name;button.type=close.type='button';button.setAttribute('role','tab');button.onclick=()=>selectTab(tab);
  close.textContent='×';close.setAttribute('aria-label','关闭 '+name);close.onclick=()=>{

  };

  group.onauxclick=e=>{if(e.button===1){e.preventDefault();close.click();}};
  group.draggable=true;

    if(group.querySelector('input'))return;

    const finish=save=>{
      if(!input.isConnected)return;

    input.onblur=()=>finish(true);input.onkeydown=e=>{if(['Escape','Enter'].includes(e.key)){e.preventDefault();finish(e.key==='Enter');}};

    if(!moving || moving===tab)return;e.preventDefault();
    const from=tabs.indexOf(moving),to=tabs.indexOf(tab);
    tabs.splice(from,1);tabs.splice(to,0,moving);
    nav.insertBefore(moving.group,tabs[to+1]?.group || document.getElementById('addTab'));moving=null;
  };
  group.append(button,close);nav.insertBefore(group,document.getElementById('addTab'));tabs.push(tab);
  frame.addEventListener('load',()=>{
    const home=frame.contentDocument?.querySelector('#home,#studio-home');
    if(home)home.onclick=e=>{e.preventDefault();selectTab(null);};
  });
  frame.srcdoc=documents[file];frames.append(frame);selectTab(tab);button.scrollIntoView({block:'nearest',inline:'nearest'});
}
landing.addEventListener('click',e=>{
  const link=e.target.closest('a.ready');if(!link || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey)return;
  e.preventDefault();openTool(link.hash.slice(1),link.querySelector('h3').textContent);
});
document.getElementById('addTab').onclick=()=>selectTab(null);

function openLinkedTool(){
  const link=[...landing.querySelectorAll('a.ready')].find(a=>a.hash===location.hash);
  if(link)openTool(link.hash.slice(1),link.querySelector('h3').textContent);
}
window.addEventListener('hashchange',openLinkedTool);openLinkedTool();
</script>
