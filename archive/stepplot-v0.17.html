  <script>
(function (root) {
  'use strict';
  const factor = { eV: 1, 'kJ/mol': 96.48533212, 'kcal/mol': 23.06054783 };
  const uid = () => 'id' + Math.random().toString(36).slice(2, 10);
  const clone = value => JSON.parse(JSON.stringify(value));
  const newHistory = () => ({ entries: [], index: -1, group: '' });
  function recordHistory(history, value, group = '', label = '编辑工程') {
    if (history.entries[history.index]?.value === value) { if (!group) history.group = ''; return; }
    if (group && history.group === group && history.index === history.entries.length - 1) history.entries[history.index] = { value, label };
    else {
      history.entries = history.entries.slice(0, history.index + 1);
      history.entries.push({ value, label }); if (history.entries.length > 80) history.entries.shift();
      history.index = history.entries.length - 1;
    }
    history.group = group;
  }
  function moveHistory(history, direction) {
    history.group = '';
    const index = history.index + direction;
    if (index < 0 || index >= history.entries.length) return null;
    history.index = index; return history.entries[index].value;
  }
  const defaults = () => ({ width: 1040, height: 660, plotWidth: '', plotHeight: '', font: 'Arial, Microsoft YaHei, sans-serif',
    fontSize: 24, deltaSize: 20, titleSize: 27, lineWidth: 3.5, stepWidth: 0.60,
    dash: 7, gap: 5, grid: true, gridWidth: .8, gridColor: '#edf0f1', axisWidth: 1.2, axisColor: '#63747d',
    legendVisible: true, legendLayout: 'horizontal', legendSize: '', legendFont: '', legendColor: '#425867', legendBold: false,
    legendDx: 0, legendDy: 0, legendLineWidth: '', legendLineLength: 28, legendGap: 22,
    legendBox: false, legendBackground: '#ffffff', legendBorderColor: '#cbd5d8', legendBorderWidth: 1,
    deltas: true, energies: false,
    decimals: 3, yMin: '', yMax: '', unit: 'eV', theme: 'blue', legend: 'top' });
  function blank() {
    return { version: 1, title: 'Free energy diagram', subtitle: '', xLabel: 'Reaction coordinate',
      yLabel: 'Relative free energy', note: '', inputMode: 'raw', energyMode: 'G',
      refs: [], systems: [], drafts: { id:'', nodes:[], edges:[] }, style: defaults(), annotations: {} };
  }
  function parseTerms(source, refs) {
    if (!source.trim()) return { terms: [], error: '' };
    const terms = [];
    for (const part of source.split(/[,;，；\n]+/).filter(s => s.trim())) {
      const match = part.trim().match(/^([A-Za-z][A-Za-z0-9_-]*)\s*[:=：]\s*([+-]?(?:\d+(?:\.\d*)?|\.\d+))$/);
      if (!match) return { terms: [], error: '格式示例：H2:0.5, H2O:-1（使用参考库中的 ID）' };
      terms.push({ ref: match[1], n: Number(match[2]) });
    }
    return { terms, error: '' };
  }
  const termsText = terms => terms.map(term => term.ref + ':' + term.n).join(', ');
  const ready = v => typeof v === 'number' && Number.isFinite(v);
  function combined(project, state) {
    const corrected = project.energyMode === 'G';
    const pieces = [{ name: '结构 E', value: state.e }];
    if (corrected) pieces.push({ name: '结构 Gcorr', value: state.gcorr });
    const pending = [];
    for (const term of state.terms) {
      const ref = project.refs.find(r => r.id === term.ref);
      const valid = ref && ready(ref.e) && (!corrected || ready(ref.gcorr));
      if (!valid && term.n) pending.push(term.ref);
      pieces.push({ name: term.n + ' × ' + (ref?.name || term.ref), value: !term.n ? 0 : valid ? term.n * (ref.e + (corrected ? ref.gcorr : 0)) : null });
    }
    pieces.push({ name: '额外修正', value: state.correction });
    return { value: pieces.every(p => ready(p.value)) ? pieces.reduce((sum, p) => sum + p.value, 0) : NaN, pieces, pending, error: '' };
  }
  function energy(project, system, state) {
    if (state.placeholder) return { value: NaN, absolute: null, baseline: null, pieces: [], pending: [], error: '' };
    if (project.inputMode === 'relative') return { value: ready(state.relative) ? state.relative : NaN, absolute: null, baseline: null, pieces: [], error: '' };
    const base = system.nodes.find(node => node.id === system.baseline);
    if (!base) return { value: NaN, error: '请为 ' + system.name + ' 选择参照状态' };
    const a = combined(project, state), b = combined(project, base), corrected = project.energyMode === 'G';
    let value = [state.e, base.e, ...(corrected ? [state.gcorr, base.gcorr] : [])].every(ready) ? state.e - base.e + (corrected ? state.gcorr - base.gcorr : 0) + state.correction - base.correction : NaN;
    const net = new Map();
    for (const [node, sign] of [[state,1],[base,-1]]) for (const t of node.terms) net.set(t.ref, (net.get(t.ref) || 0) + sign * t.n);
    const pending = [];
    for (const [id, n] of net) if (Math.abs(n) > 1e-10) {
      const ref = project.refs.find(r => r.id === id);
      if (!ref || !ready(ref.e) || (corrected && !ready(ref.gcorr))) { pending.push(id); value = NaN; }
      else value += n * (ref.e + (corrected ? ref.gcorr : 0));
    }
    if (state.autoIssue || base.autoIssue) value = NaN;
    return { value, absolute: a.value, baseline: b.value, pieces: a.pieces, pending, error: '' };
  }
  function node(label, stage, e = null) {
    return { id: uid(), label, stage, e, gcorr: 0, terms: [], correction: 0, relative: null, x: 0, width: 1, showLabel: true };
  }
  function labelVisible(project, node) {
    const a = project.annotations['node:' + node.id] || {};
    return node.showLabel !== false && !a.hidden && String(a.text ?? node.label).trim() !== '';
  }
  function setLabelVisible(project, node, visible) {
    node.showLabel = visible;
    const a = project.annotations['node:' + node.id];
    if (a) { delete a.hidden; if (visible && a.text?.trim() === '') delete a.text; }
  }
  function patchAnnotations(project, keys, patch) {
    for (const key of keys) {
      const a = project.annotations[key] ||= {};
      for (const [field, value] of Object.entries(patch)) { if (value === undefined) delete a[field]; else a[field] = value; }
      if (patch.color) delete a.colorSystem;
      if (patch.colorSystem) delete a.color;
    }
  }
  function setSystemName(project, system, name) {
    system.name = name;
    const legend = project.annotations['legend:' + system.id];
    if (legend) delete legend.text;
  }
  function setSystemColor(project, system, color) {
    system.color = color;
    const keys = ['legend:' + system.id, ...system.nodes.flatMap(n => ['node:' + n.id, 'energy:' + n.id]), ...system.edges.flatMap(e => ['delta:' + e.id, 'ts:' + e.id])];
    patchAnnotations(project, keys, { colorSystem: system.id });
  }
  function exportName(project, extension) {
    const names = project.systems.map(s => optionText(s.name).replace(/[<>:"/\\|?*\x00-\x1f]/g, '').trim().replace(/\s+/g, '-').replace(/[. ]+$/g, '').slice(0, 24)).filter(Boolean);
    let name = names.slice(0, 2).join('_') || 'stepplot';
    if (names.length > 2) name += '+' + (names.length - 2);
    if (/^(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i.test(name)) name = 'plot-' + name;
